[package]
name = "sprites_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sprites (`pulsar.sprites`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the hierarchy's sprite quick-add) and the
# crates they need. A game links the root without it, so it takes no editor
# dependency.
editor = ["dep:sprites_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
inventory = { workspace = true }
# The plugin's crates.
sprites_component = { workspace = true }
sprites_editor = { workspace = true, optional = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
helio_component = { workspace = true }
pulsar_world_registry = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

[dev-dependencies]
# The moved tests: images as world assets, a new device gets every bound
# asset again (GPU; with a mesh, the meshes' component crate), the join
# places sprites by their owners (GPU).
meshes_component = { workspace = true }
engine_state = { workspace = true }
helio = { workspace = true }
helio-core = { workspace = true }
helio-pass-sprite-batch = { workspace = true }
helio-scene-join = { workspace = true }
pulsar_scenedb = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = "=0.4.0"
tempfile = { workspace = true }

[lints]
workspace = true
